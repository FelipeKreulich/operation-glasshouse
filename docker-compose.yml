networks:
  net-offense:
    driver: bridge
    internal: true
  net-c2:
    driver: bridge
  net-detection:
    driver: bridge

volumes:
  sliver-data:

services:
  sliver-c2:
    build:
      context: ./c2
    container_name: sliver-c2
    hostname: sliver-c2
    networks:
      - net-c2
    volumes:
      - sliver-data:/root/.sliver
    stdin_open: true
    tty: true
    restart: unless-stopped
  target:
    build:
      context: ./target
    container_name: target
    hostname: target
    networks:
      - net-offense
    restart: unless-stopped
  redirector:
    build:
      context: ./redirector
    container_name: redirector
    hostname: redirector
    networks:
      - net-offense
      - net-c2
    restart: unless-stopped
